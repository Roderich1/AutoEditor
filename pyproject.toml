[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "content-engine"
version = "0.1.0"
description = "Local-first long-form video content engine"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "rich>=14,<15",
    "structlog>=25,<26",
    "tenacity>=9,<10",
    "typer>=0.16,<1",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.2,<2"]
analysis = ["openai>=1.100,<2"]

[dependency-groups]
dev = [
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
content-engine = "content_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/content_engine"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Markdown under docs/ contains illustrative specification snippets and archived
# handoff material. They are documentation, not source, and must not be rewritten.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=content_engine --cov-report=term-missing"
markers = [
    "integration: exercises real FFmpeg or ffprobe; skipped with a reason when absent",
    "slow: downloads or runs a real transcription model",
    "ai: calls a paid external AI provider; never part of the normal suite",
]
