name: CI

# The same commands CLAUDE.md requires locally, on Ubuntu, so a change that only
# works on Windows fails here rather than after a merge.
#
# No secrets, no AI provider and no network fixtures: faster-whisper is not
# installed, the integration tests synthesise their media locally with lavfi, and
# nothing downloads a video. yt-dlp stays outside the core.
#
# Supply chain: actions are pinned to full commit SHAs, because a tag can be
# moved to point at other code. Every uv invocation passes --frozen so versions
# come from uv.lock rather than being re-resolved at run time, and --no-build so
# nothing is installed from a source distribution, whose setup script would run
# arbitrary code on the runner. Verified: the project still installs, imports and
# passes its whole suite under those flags.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.3.0
        with:
          # git diff --check needs a merge base, which a shallow clone lacks.
          fetch-depth: 0

      - name: Install FFmpeg and ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync from the lockfile
        run: uv sync --frozen --no-build --group dev

      - name: Ruff check
        run: uv run --frozen --no-build ruff check .

      - name: Ruff format check
        run: uv run --frozen --no-build ruff format --check .

      - name: mypy
        run: uv run --frozen --no-build mypy src

      - name: Tests with the coverage gate
        run: uv run --frozen --no-build pytest

      # --no-cov is required. --cov-fail-under=80 measures whatever selection
      # pytest was given, and 13 integration tests cover about 68% of the package
      # on their own, so the focused run would fail on coverage even when every
      # test passes. The gate stays intact for the full suite above.
      - name: Integration tests with real FFmpeg
        run: uv run --frozen --no-build pytest -m integration --no-cov

      - name: Build the wheel and sdist
        run: uv build

      - name: Whitespace check on the diff
        env:
          BASE: ${{ github.event.pull_request.base.ref || 'main' }}
        run: git diff --check "origin/$BASE...HEAD"

      - name: The working tree must be clean after every step
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
